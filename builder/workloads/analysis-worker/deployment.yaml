apiVersion: apps/v1
kind: Deployment
metadata:
  name: analysis-worker
  namespace: bvault-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analysis-worker
  template:
    metadata:
      labels:
        app: analysis-worker
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: analysis-worker
          image: analysis-worker-image
          ports:
            - containerPort: 8090
              name: health
          envFrom:
            - configMapRef:
                name: analysis-worker-config
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: music-store
              mountPath: /mnt/music-store
          resources:
            requests:
              memory: "100Mi"
              cpu: "1"
            limits:
              memory: "200Mi"
              cpu: "1.5"
          livenessProbe:
            httpGet:
              path: /livez
              port: health
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: music-store
          persistentVolumeClaim:
            claimName: music-store-pvc
