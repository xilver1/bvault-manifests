apiVersion: v1
kind: PersistentVolume
metadata:
  name: music-store-pv
spec:
  capacity:
    storage: 2Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: 192.168.0.190
    path: /music-pool
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: music-store-pvc
  namespace: bvault-prod
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 1.8Ti
