apiVersion: v1
kind: ConfigMap
metadata:
  name: export-builder-config
  namespace: bvault-prod
data:
  # Without this the services start with an empty EnvFilter, which disables
  # every log line — Alloy then ships nothing to Loki. sqlx logs statements
  # at debug, so `info` stays quiet per-query and still surfaces slow ones.
  RUST_LOG: "info"
  BIND_ADDR: "0.0.0.0:8081"
  RAW_STORE_ROOT: "/mnt/music-store/raw"
  ARTIFACT_STORE_ROOT: "/mnt/music-store/artifacts"
  STAGING_ROOT: "/mnt/music-store/staging"
  EXPORT_TTL_HOURS: "24"
  DB_MAX_CONNECTIONS: "5"
  OTEL_EXPORTER_OTLP_ENDPOINT: "192.168.0.192:4318"
