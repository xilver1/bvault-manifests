apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: bvault-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: gateway
          image: gateway-image
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: gateway-config
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: music-store
              mountPath: /mnt/music-store
      volumes:
        - name: music-store
          persistentVolumeClaim:
            claimName: music-store-pvc
