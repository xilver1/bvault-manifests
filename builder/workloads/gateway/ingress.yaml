apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-ingress
  namespace: bvault-prod
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # ingress-nginx defaults client_max_body_size to 1m, so audio uploads 413
    # before reaching the gateway (which itself allows 200 MiB). Match it here.
    nginx.ingress.kubernetes.io/proxy-body-size: "200m"
spec:
  ingressClassName: nginx
  rules:
    - host: 192.168.0.200.nip.io
      http:
        paths:
          - path: /exports
            pathType: Prefix
            backend:
              service:
                name: export-builder
                port:
                  number: 8081
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
