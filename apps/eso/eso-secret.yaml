apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-secret
  namespace: bvault-prod
spec:
  refreshInterval: 24h
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: /lab/compute/postgres_password
    - secretKey: POSTGRES_USER
      remoteRef:
        key: /lab/compute/postgres_user
    - secretKey: POSTGRES_DB
      remoteRef:
        key: /lab/compute/postgres_db
  secretStoreRef:
    kind: ClusterSecretStore
    name: external-secrets-cluster-store
  target:
    name: postgres-secret